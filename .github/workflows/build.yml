name: Build PULSE 4K APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o PULSE4K_Mobile_Android_Project.zip

      - name: Build APK
        working-directory: PULSE4K_Mobile
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PULSE4K-Mobile-APK
          path: PULSE4K_Mobile/app/build/outputs/apk/debug/app-debug.apk
