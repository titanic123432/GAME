name: Build PULSE 4K APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        shell: bash
        run: |
          git ls-files
          mapfile -t files < <(find . -type f -iname "*.zip" -not -path "./.git/*")
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one ZIP file"
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          unzip -o "${files[0]}"

      - name: Build APK
        working-directory: PULSE4K_Mobile
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PULSE4K-Mobile-APK
          path: PULSE4K_Mobile/app/build/outputs/apk/debug/app-debug.apk
